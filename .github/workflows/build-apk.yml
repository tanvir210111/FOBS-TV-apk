name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps || npm install --force

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle (with Auto-Retry)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace || {
            echo "Initial build encountered an issue. Stopping daemons, cleaning, and retrying..."
            ./gradlew --stop
            ./gradlew clean --no-daemon
            ./gradlew assembleDebug --no-daemon --stacktrace
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOBS-TV-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: latest
          name: "FOBS TV Latest (v1.5.0)"
          body: "Latest FOBS TV APK release v1.5.0: Portrait player alignment & tap controls, MovieBox streaming engine, direct APK download, and stability fixes."
          draft: false
          prerelease: false
          make_latest: true
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

